# Generated by PNCconf at Sat Feb 14 12:00:00 2026
# Using LinuxCNC version:  Master (2.9)
# If you make changes to this file, they will be
# overwritten when you run PNCconf again

[EMC]
MACHINE = printnc
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = probe_basic
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = COMMANDED

MAX_FEED_OVERRIDE = 2.000000
DEFAULT_LINEAR_VELOCITY = 3.3333
MAX_LINEAR_VELOCITY = 10.0
MIN_LINEAR_VELOCITY = 0.02

MAX_SPINDLE_OVERRIDE = 2.00000
MIN_SPINDLE_OVERRIDE = 0.25000
INTRO_GRAPHIC = pbsplash.png
INTRO_TIME = 3
OPEN_FILE = ~/linuxcnc/nc_files/pb_examples/blank.ngc
CONFIG_FILE = custom_config.yml
PROGRAM_PREFIX = /home/cnc/linuxcnc/nc_files
INCREMENTS = JOG .1in .01in .001in

EDITOR = gedit
GEOMETRY = xyz
CYCLE_TIME = 100
USER_TABS_PATH = user_tabs/
USER_BUTTONS_PATH = user_buttons/
USER_DROS_PATH = user_dro_display/
DRO_DISPLAY = xyz
KEYBOARD_JOG = true
KEYBOARD_JOG_SAFETY_OFF = true

# Don't have an A axis yet
#DEFAULT_ANGULAR_VELOCITY = 12.000000
#MAX_ANGULAR_VELOCITY = 360
#MIN_ANGULAR_VELOCITY = 1

# ATC tab display options, 0 = no atc tab displayed, 1 = Carousel atc display, 2 = rack atc display
ATC_TAB_DISPLAY = 0
#USER_ATC_BUTTONS_PATH = user_atc_buttons/

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
RS274NGC_STARTUP_CODE = F10 S6000 G20 G17 G40 G49 G54 G64 P.001 G80 G90 G91.1 G92.1 G94 G97 G98
PARAMETER_FILE = probe_basic.var
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
SUBROUTINE_PATH = subroutines
ON_ABORT_COMMAND = O<on_abort> CALL

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HMOT]
# **** This is for info only ****
CARD0=hm2_7i96s.0

[HAL]
HALUI = halui
HALFILE = printnc.hal
HALFILE = vfd.hal
HALFILE = custom.hal
HALFILE = xhc-whb04b-6.hal
POSTGUI_HALFILE = probe_basic_postgui.hal
TWOPASS = on

[HALUI]
MDI_COMMAND=(debug,macro0)
MDI_COMMAND=G0 X15 Y20 Z6
MDI_COMMAND=(debug,macro2)
MDI_COMMAND=(debug,macro3)
MDI_COMMAND=(debug,macro4)
MDI_COMMAND=(debug,macro5)
MDI_COMMAND=(debug,macro6)
MDI_COMMAND=(debug,macro7)
MDI_COMMAND=(debug,macro8)
MDI_COMMAND=(debug,macro9)
MDI_COMMAND=(debug,macro10)
MDI_COMMAND=(debug,macro11)
MDI_COMMAND=(debug,macro12)
MDI_COMMAND=(debug,macro13)
MDI_COMMAND=(debug,macro14)
MDI_COMMAND=(debug,macro15)
MDI_COMMAND=(debug,macro16)

[KINS]
JOINTS = 4
KINEMATICS = trivkins coordinates=XYYZ kinstype=BOTH

[TRAJ]
AXES = 3
COORDINATES =  XYYZ
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 3.3333
MAX_LINEAR_VELOCITY = 14.0

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

# Changes required for TooTall18 scripts
